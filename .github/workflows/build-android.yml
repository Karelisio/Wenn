name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # Détermine (et, sur un push main, crée + pousse) le tag de release à
      # publier. Un tag poussé ici avec le token par défaut ne redéclenche PAS
      # ce workflow (limitation GitHub Actions anti-boucle) : la Release est
      # donc publiée directement dans CE run, pas via un second déclenchement.
      - name: Determine release tag
        id: release_tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git tag --list "v*" --sort=-v:refname | head -n1)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v1.0.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag de release : $TAG"

      - name: Stamp app version
        working-directory: android
        run: |
          VERSION_CODE="${{ github.run_number }}"
          RELEASE_TAG="${{ steps.release_tag.outputs.tag }}"
          if [ -n "$RELEASE_TAG" ]; then
            VERSION_NAME="${RELEASE_TAG#v}"
          else
            VERSION_NAME="0.0.0-${GITHUB_SHA::7}"
          fi
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          echo "Version: code=$VERSION_CODE name=$VERSION_NAME"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/app/release.keystore"

      - name: Print signing certificate SHA256 (for App Links / assetlinks.json)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "${{ github.workspace }}/android/app/release.keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | grep "SHA256:"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ github.workspace }}/android/app/release.keystore"

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" "wenn-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenn-release-apk
          path: wenn-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: wenn-release.apk
          generate_release_notes: true
